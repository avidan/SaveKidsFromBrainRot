name = "skfbr-backend"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[observability]
enabled = true

# Build the dashboard before every deploy so [assets] always has a fresh
# dist/ — this is what makes the Deploy-to-Cloudflare button (Workers Builds
# CI) work on a fresh fork, and it keeps local `wrangler deploy` honest too.
[build]
command = "npm install --prefix ../dashboard --no-audit --no-fund && npm run build --prefix ../dashboard"

# Import schema.sql as a string so the Worker can self-apply it to an empty
# database on first request (the button provisions D1 but can't run SQL).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# The Worker also serves the parent dashboard as static assets, so one
# `wrangler deploy` ships the whole product. Build the dashboard first
# (npm run build in ../dashboard) — deploy fails if dist/ is missing.
# Requests matching a built file are served directly; everything else
# (all API routes) falls through to the Worker.
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
# updates.xml is generated by the Worker (it rewrites the CRX download URL to
# this deployment's own origin, so self-hosted force-installs don't depend on
# anyone else's domain). Everything else in /plugin/ serves as a plain asset.
run_worker_first = ["/plugin/updates.xml"]

# Easiest setup: run `npm run setup` at the repo root — it does all of the
# steps below interactively. Manual equivalent:
# 1. Create the database:  npx wrangler d1 create skfbr
# 2. Paste the database_id it prints below.
# 3. Apply the schema:     npm run db:apply
# 4. Deploy:               npm run deploy
# 5. Set the API key:      npx wrangler secret put ANTHROPIC_API_KEY
#
# Optional (email notifications via https://resend.com):
#   npx wrangler secret put RESEND_API_KEY
#   and set NOTIFY_FROM below to a verified sender, e.g.
#   [vars]
#   NOTIFY_FROM = "SaveKidsFromBrainRot <alerts@yourdomain.com>"
[[d1_databases]]
binding = "DB"
database_name = "skfbr"
database_id = "e8831494-4200-4633-b0e3-8a556e50ef9c"
